<title>TOP Kitchen Ops</title>

<style>
:root{
  --bg:#0f1117;--surf:#1a1d27;--surf2:#232636;--surf3:#2d3147;
  --bdr:#333650;--bdr2:#3d4160;--tx:#e8eaf0;--tx2:#9ca3af;--tx3:#6b7280;
  --acc:#6366f1;--acc2:#818cf8;--acc-bg:rgba(99,102,241,.12);
  --grn:#10b981;--grn-bg:rgba(16,185,129,.12);
  --amb:#f59e0b;--amb-bg:rgba(245,158,11,.12);
  --red:#ef4444;--red-bg:rgba(239,68,68,.12);
  --blu:#0ea5e9;--blu-bg:rgba(14,165,233,.12);
  --r:8px;--rl:12px;--sidebar:220px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;font-size:14px;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{background:var(--surf);border-bottom:1px solid var(--bdr);padding:0 20px;display:flex;align-items:center;height:52px;gap:12px;flex-shrink:0}
.logo{font-weight:700;font-size:15px}.logo span{color:var(--acc2)}
#cov{margin-left:auto;background:var(--surf2);border:1px solid var(--bdr);padding:3px 10px;border-radius:20px;font-size:11px;color:var(--tx2);display:flex;align-items:center;gap:6px}
.covdot{width:6px;height:6px;border-radius:50%;background:var(--grn);box-shadow:0 0 5px var(--grn);flex-shrink:0}
#layout{display:flex;flex:1;overflow:hidden}
nav{width:var(--sidebar);background:var(--surf);border-right:1px solid var(--bdr);display:flex;flex-direction:column;padding:12px 8px;gap:2px;flex-shrink:0;overflow-y:auto}
.nb{padding:10px 12px;background:none;border:none;border-radius:var(--r);color:var(--tx2);cursor:pointer;font-size:13px;font-weight:500;text-align:left;width:100%;display:flex;align-items:center;gap:10px}
.nb:hover{background:var(--surf2);color:var(--tx)}.nb.on{background:var(--acc-bg);color:var(--acc2)}
.nb .ic{font-size:15px;width:20px;text-align:center;flex-shrink:0}
.nav-sec{font-size:10px;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:.6px;padding:8px 12px 4px;margin-top:4px}
main{flex:1;overflow-y:auto;padding:24px}
.card{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--rl);padding:20px;margin-bottom:16px}
.ct{font-size:12px;font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
input,select{background:var(--surf2);border:1px solid var(--bdr);border-radius:var(--r);color:var(--tx);padding:8px 12px;font-size:13px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--acc)}
label{font-size:12px;color:var(--tx2);display:block;margin-bottom:4px}
.fg{margin-bottom:12px}
.btn{padding:8px 16px;border-radius:var(--r);border:none;cursor:pointer;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.bp{background:var(--acc);color:#fff}.bs{background:var(--grn);color:#fff}
.bg2{background:var(--surf2);color:var(--tx);border:1px solid var(--bdr)}.bd{background:var(--red);color:#fff}
.bsm{padding:5px 10px;font-size:12px}
.tw{overflow-x:auto;border-radius:var(--r);border:1px solid var(--bdr)}
table{width:100%;border-collapse:collapse}
th{background:var(--surf2);padding:10px 14px;text-align:left;font-size:12px;font-weight:600;color:var(--tx2);text-transform:uppercase;white-space:nowrap}
td{padding:10px 14px;font-size:13px;border-top:1px solid var(--bdr)}
tr:hover td{background:rgba(255,255,255,.02)}
.bx{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.bxg{background:var(--grn-bg);color:var(--grn)}.bxa{background:var(--amb-bg);color:var(--amb)}
.bxr{background:var(--red-bg);color:var(--red)}.bxb{background:var(--blu-bg);color:var(--blu)}
.bxp{background:var(--acc-bg);color:var(--acc2)}
.sb{height:6px;border-radius:3px;background:var(--surf3);overflow:hidden;margin-top:4px}
.sbf{height:100%;border-radius:3px}
.flg{display:flex;align-items:flex-start;gap:10px;padding:12px;border-radius:var(--r);border-left:3px solid;margin-bottom:8px;font-size:13px}
.fg-r{background:var(--red-bg);border-color:var(--red)}.fg-a{background:var(--amb-bg);border-color:var(--amb)}
.fg-g{background:var(--grn-bg);border-color:var(--grn)}.fg-b{background:var(--blu-bg);border-color:var(--blu)}
.pts{display:flex;gap:4px;background:var(--surf2);padding:4px;border-radius:var(--r);width:fit-content;margin-bottom:16px;flex-wrap:wrap}
.pt{padding:6px 14px;border-radius:6px;border:none;background:none;color:var(--tx2);cursor:pointer;font-size:12px;font-weight:500}
.pt.on{background:var(--surf3);color:var(--tx)}
.uzn{border:2px dashed var(--bdr2);border-radius:var(--rl);padding:32px;text-align:center;cursor:pointer}
.uzn:hover,.uzn.active{border-color:var(--acc);background:var(--acc-bg)}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--surf)}
::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:3px}
@media(max-width:900px){.g2,.g3{grid-template-columns:1fr}nav{width:180px}main{padding:12px}}
</style></head><body>

  <button class="nb" id="nb-settings"    onclick="go('settings')"><span class="ic">⚙️</span>Settings</button>
</nav>

  var it=ITEMS[k];if(!it)return 1;
  if(it.unit==='pcs')return it.pcs_per_pkt||1; // pcs per packet
  return it.pkt?(it.pkt/1000):1;               // g → kg per packet
}
function toPackets(k,val){
  if(!val||val<=0)return 0;
  var ps=pktSize(k);
  return ps>0?Math.ceil(val/ps):0;
}
function fromPackets(k,pkts){
  if(!pkts||pkts<0)return 0;
  return pkts*pktSize(k);
}
function pktLabel(k){
  var it=ITEMS[k];if(!it)return 'pkts';
  if(it.unit==='pcs')return (it.pcs_per_pkt||1)+' pcs/pkt';
  return (it.pkt||'?')+'g/pkt';
}

// ── CONSUMPTION ENGINE ────────────────────────────────────────────────────────
function getWeekly(k){
  var it=ITEMS[k];if(!it)return 0;
  var hist=CHIST[k]||(mkHistory()[k]||[0,0,0,0,0]);
  var n=0,d=0;
  for(var i=0;i<hist.length;i++){var w=WEEK_WEIGHTS[i]||1;n+=w*hist[i];d+=w;}
  var computed=d>0?n/d:0;
  return computed||(it.unit==='pcs'?(it.weekly_pcs||0):(it.weekly_kg||0));
}
function getDaily(k){return getWeekly(k)/7;}

// ── STOCK ENGINE ──────────────────────────────────────────────────────────────
function getStock(b,k){return(STOCK[b]&&STOCK[b][k]!=null)?STOCK[b][k]:0;}
function setStock(b,k,v){if(!STOCK[b])STOCK[b]={};STOCK[b][k]=Math.max(0,Math.round(v*10000)/10000);save();}
function addStock(b,k,v){setStock(b,k,getStock(b,k)+v);}
function getDOS(b,k){var s=getStock(b,k),r=getDaily(k);return r>0?Math.round(s/r*10)/10:99;}
function getTotDOS(k){
  var tot=BRANCH_KEYS.reduce(function(s,b){return s+getStock(b,k);},0);
  var r=getDaily(k);return r>0?Math.round(tot/r*10)/10:99;
}
function scol(d,t){t=t||7;return d>=t*.8?'#10b981':d>=t*.4?'#f59e0b':'#ef4444';}
function sbcls(d,t){t=t||7;return d>=t*.8?'bxg':d>=t*.4?'bxa':'bxr';}

// ── SKU MAPPER ────────────────────────────────────────────────────────────────
function mapSKU(name,variation){
  var nl=name.toLowerCase();
  var vl=(variation||'').toLowerCase();
  // Exclude
  if(/shake|coffee|buttermilk|chaas|kombucha|smoothie|brownie|laddoo|chikki|whey|protein powder|single combo|buddy combo|diet coke|oatmeal/.test(nl))return null;
  // Format
  var fmt='';
  if(/burrito bowl|mexican bowl|herbed tofu burrito|mexican paneer burrito|mexican herbed/.test(nl))fmt='burrito';
  else if(/meal bowl|rice meal bowl/.test(nl))fmt='meal_bowl';
  else if(/thali/.test(nl))fmt='thali';
  else if(/mini roll/.test(nl))fmt='mini_roll';
  else if(/5 inch|half/.test(vl))fmt='half_sand';
  else if(/10 inch|full/.test(vl))fmt='full_sand';
  else if(/classic sandwich/.test(nl))fmt='classic';
  else if(/burger/.test(nl))fmt='burger';
  else if(/sandwich|sub|powerhouse/.test(nl))fmt='sandwich';
  else if(/roll|wrap/.test(nl))fmt='roll';
  if(!fmt)return null;
  var FG={roll:120,mini_roll:65,half_sand:95,full_sand:180,classic:75,sandwich:95,burger:100,meal_bowl:200,thali:200,burrito:120};
  var RG={meal_bowl:250,thali:250,burrito:150};
  if(/corn n cheese|corn & cheese/.test(nl))FG.burger=75;
  var g=FG[fmt],rg=RG[fmt]||0;
  if(!g)return null;
  // Filling
  if(/smoky red bean tempeh|red bean tempeh/.test(nl))return{k:'rajma_tempeh_patty',g:g,rg:rg};
  if(/chickpea cheezy tempeh/.test(nl))return{k:'chickpea_tempeh_patty',g:g,rg:rg};
  if(/corn n cheese burger|classic corn n cheese/.test(nl))return{k:'corn_cheese_patty',g:g,rg:rg};
  if(/tandoori tempeh powerhouse|tandoori tempeh patty wrap/.test(nl))return{k:'tandoori_tempeh_patty',g:g,rg:rg};
  if(/mexican grilled cheese/.test(nl))return{k:'mexican_patty',g:g,rg:rg};
  if(/garlic tofu crunch wrap|garlic tofu crunch finger/.test(nl))return{k:'tofu_fingers',g:g,rg:rg};
  if(/golden veg signature|veggies fingers wrap/.test(nl))return{k:'veggie_fingers',g:g,rg:rg};
  if(/chatpata aalu crunch|achari aalu crunch/.test(nl))return{k:'potato_fingers',g:g,rg:rg};
  if(/crispy tandoori tempeh bites|crispy tempeh bites|crispy tempeh balls/.test(nl))return{k:'tempeh_balls',g:100,rg:0};
  if(/crispy tofu bites|garlic tofu pops|crispy tofu balls|garlic tofu bites/.test(nl))return{k:'tofu_balls',g:100,rg:0};
  if(/crispy veg balls|veg crunch balls/.test(nl))return{k:'veg_balls',g:100,rg:0};
  if(/crispy achari potato pops|tangy potato poppers/.test(nl))return{k:'potato_balls',g:100,rg:0};
  if(/peri blast paneer|smoky peri paneer/.test(nl))return{k:'peri_peri_paneer',g:g,rg:rg};
  if(/chilli paneer/.test(nl))return{k:'chilli_paneer',g:g,rg:rg};
  if(/desi tofu bhurji|tofu bhurji masala/.test(nl))return{k:'tofu_bhurji',g:g,rg:rg};
  if(/paneer bhurji|desi paneeer bhurji/.test(nl))return{k:'paneer_bhurji',g:g,rg:rg};
  if(/lehsuni paneer tikka|lehsuni power fuel/.test(nl)&&!/tempeh/.test(nl))return{k:'lehsuni_paneer',g:g,rg:rg};
  if(/tandoori tempeh lehsuni|tempeh lehsuni|garlic tandoori power sub/.test(nl))return{k:'tempeh_lehsuni',g:g,rg:rg};
  if(/tempeh bhurji|bhurji meaty|bhurji powerhouse/.test(nl))return{k:'tempeh_bhurji',g:g,rg:rg};
  if(/ghee roast/.test(nl))return{k:'ghee_roast',g:g,rg:rg};
  if(/masala tikka|smoky spice wrap|meaty masala|spicy grill wrap|tandoori meaty bowl|chilli meaty bowl/.test(nl))return{k:'masala_tikka',g:g,rg:rg};
  if(/peri.?peri/.test(nl)&&!/paneer/.test(nl)&&!/blast/.test(nl))return{k:'peri_peri_tempeh',g:g,rg:rg};
  if(/desi chinese|kung pao|chilli tempeh bowl/.test(nl))return{k:'kung_pao',g:g,rg:rg};
  if(/tofu/.test(nl))return{k:'tofu',g:g,rg:rg};
  // Momos: 5 pcs per plate
  if(/keema momo/.test(nl))return{k:'tempeh_keema',g:75,rg:0};   // 5 × 15g = 75g
  if(/peri.?peri momo/.test(nl))return{k:'peri_peri_tempeh',g:60,rg:0}; // 5 × 12g = 60g
  if(/tempeh keema|keema bulk|keema powerhouse|keema roll|vegan keema|royal masala keema|loaded keema|indian thali/.test(nl)&&!/paneer/.test(nl))return{k:'tempeh_keema',g:g,rg:rg};
  if(/paneer|makhani|makhni/.test(nl))return{k:'paneer',g:g,rg:rg};
  return null;
}

// ── UPLOAD PROCESSOR ─────────────────────────────────────────────────────────
async function processFiles(files){
  var p=document.getElementById('uprog');
  if(p)p.innerHTML='<div style="color:var(--tx2);font-size:13px">Processing '+files.length+' file(s)...</div>';
  var processed=0,totalRows=0;
  window.UPLOAD_SESSION={}; // reset accumulator for this upload batch
  for(var i=0;i<files.length;i++){
    try{
      var buf=await files[i].arrayBuffer();
      var wb=XLSX.read(buf,{type:'array',cellDates:true});
      var isAddon=/addon/i.test(files[i].name);
      var raw=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',raw:false});
      // Detect branch from row 2
      var branch='UNKNOWN';
      for(var r=0;r<5;r++){
        var cell=String((raw[r]&&(raw[r][1]||raw[r][0]))||'');
        var m=cell.match(/\(([^)]+)\)/);
        if(m){branch=m[1].trim().toUpperCase().replace('INDIRANAGAR','IND').replace('MARATHAHALLI','MTH');break;}
      }
      var rows=0;
      if(!isAddon){
        var today=new Date();
        var weekBuckets={};
        var branchClosingTs=CLOSING_TS[branch]||0;
        for(var r=7;r<raw.length;r++){
          var row=raw[r];
          var dRaw=row[0];
          if(!dRaw||String(dRaw).trim()==='Total'||String(dRaw).trim()==='Date')continue;
          var d;
          if(dRaw instanceof Date){d=dRaw;}
          else{
            var ds=String(dRaw).trim();
            d=new Date(ds);
            if(isNaN(d.getTime())){
              var pts=ds.split(/[\/-]/);
              if(pts.length===3){
                d=new Date(pts[2]+'-'+pts[1]+'-'+pts[0]);
                if(isNaN(d.getTime()))d=new Date(pts[0]+'-'+pts[1]+'-'+pts[2]);
              }
            }
          }
          if(!d||isNaN(d.getTime()))continue;
          var tsRow=d.getTime();
          var qty=parseFloat(String(row[5]||'').replace(/,/g,''));
          if(isNaN(qty)||qty<=0)continue;
          var nm=String(row[3]||''),vr=String(row[13]||'');
          // Sales AFTER closing stock timestamp → deduct from branch stock
          if(tsRow>branchClosingTs){
            var mapped=mapSKU(nm,vr);
            if(mapped){
              var fillG=qty*mapped.g*(branch==='IND'?1.5:1.0);
              var riceG=qty*mapped.rg*(branch==='IND'?1.5:1.0);
              // Convert to internal units and deduct
              var fillDeduct=ITEMS[mapped.k]&&ITEMS[mapped.k].unit==='pcs'?qty:fillG/1000;
              addStock(branch,mapped.k,-fillDeduct);
              if(mapped.rg>0){
                var rk=mapped.k==='kung_pao'?'fried_rice':'jeera_rice';
                addStock(branch,rk,-riceG/1000);
              }
            }
          }
          // All rows update consumption history
          var diffDays=Math.floor((today-d)/(1000*60*60*24));
          var wk=Math.max(0,Math.min(4,Math.floor(diffDays/7)));
          if(!weekBuckets[wk])weekBuckets[wk]=[];
          weekBuckets[wk].push({name:nm,qty:qty,variation:vr,branch:branch});
          rows++;
        }
        // Update consumption history
        Object.keys(weekBuckets).forEach(function(wk){
          updateConsHistory(weekBuckets[wk],parseInt(wk));
        });
        totalRows+=rows;
        console.log('Branch:'+branch+' rows:'+rows+' closingTs:'+new Date(branchClosingTs).toLocaleString());
      }else{
        rows=Math.max(0,raw.length-10);totalRows+=rows;
      }
      UPMETA.files.push({name:files[i].name,branch:branch,rows:rows,type:isAddon?'addon':'item',at:Date.now()});
      UPMETA.last=Date.now();save();processed++;
    }catch(err){console.error('Upload error',files[i].name,err);}
  }
  updCov();
  var msg='✓ Processed '+processed+' file(s) · '+totalRows+' rows. Consumption updated. Sales after closing stock timestamp deducted from branch stock.';
  if(p)p.innerHTML='<div class="flg fg-g"><span>✓</span><span>'+msg+'</span></div>';
  // Notify that schedule will be fresh next time user visits it
  updCov();
  rUpload();
}

function updateConsHistory(entries,weekOffset){
  var sums={};
  entries.forEach(function(e){
    var m=mapSKU(e.name,e.variation);if(!m)return;
    var g=e.qty*m.g*(e.branch==='IND'?1.5:1.0);
    sums[m.k]=(sums[m.k]||0)+g/1000;
    if(m.rg>0){var rk=m.k==='kung_pao'?'fried_rice':'jeera_rice';sums[rk]=(sums[rk]||0)+e.qty*m.rg*(e.branch==='IND'?1.5:1.0)/1000;}
  });
  // Accumulate across multiple branch uploads — add to existing value
  // A separate "upload session" reset is needed to avoid infinite accumulation.
  // We track which (key,weekOffset) pairs have been set this session via UPLOAD_SESSION.
  if(!window.UPLOAD_SESSION)window.UPLOAD_SESSION={};
  Object.keys(sums).forEach(function(k){
    if(!CHIST[k])CHIST[k]=mkHistory()[k]||[0,0,0,0,0];
    var it=ITEMS[k];
    var val=sums[k];
    if(it&&it.unit==='pcs'&&it.grams_each)val=val/it.grams_each*1000;
    var idx=4-weekOffset;
    if(idx>=0&&idx<=4){
      var sessionKey=k+'_'+idx;
      if(!window.UPLOAD_SESSION[sessionKey]){
        // First branch for this item+week this session: reset to new value
        window.UPLOAD_SESSION[sessionKey]=true;
        CHIST[k][idx]=Math.round(val*100)/100;
      } else {
        // Subsequent branch: add to existing
        CHIST[k][idx]=Math.round((CHIST[k][idx]+val)*100)/100;
      }
    }
  });
  save();
}

// ── PRODUCTION PLAN ───────────────────────────────────────────────────────────
function buildPlan(){
  var today=new Date();
  var monDow=(today.getDay()+6)%7;
  var toNext=7;[2,4,5].forEach(function(d){var diff=(d-monDow+7)%7;if(diff<toNext)toNext=diff;});
  var plan=[];
  Object.keys(ITEMS).forEach(function(k){
    var it=ITEMS[k];
    if(it.is_raw_material)return; // raw materials are not produced
    var fkg=getStock('FACTORY',k);
    var r=getDaily(k);
    var fdays=r>0?Math.round(fkg/r*10)/10:99;
    var wkly=getWeekly(k);
    var pq=it.freq==='biweekly'?wkly*PROD_MULT*2:wkly*PROD_MULT;
    pq=Math.round(pq*10)/10;
    plan.push({key:k,label:it.label,freq:it.freq,cat:it.cat||'',color:it.color||'#aaa',
      prod_kg:pq,unit:it.unit||'kg',daily_r:r,factory_days:fdays,total_days:getTotDOS(k),
      overdue:fdays<toNext+1,isolated:it.isolated||false,est_hrs:0,assigned_day:-1});
  });
  plan.sort(function(a,b){return a.factory_days-b.factory_days;});
  return plan;
}
function estHrs(kg,cat){
  var base=cat==='rice'||cat==='sauce'||cat==='special'?kg/8:cat==='patty'||cat==='snack'?kg/4:kg/5;
  return Math.max(1,Math.round((base+(kg>55?3:kg>45?2:kg>35?1:0))*10)/10);
}
function assignSlots(plan,startDay){
  startDay=startDay||0;
  var maxHrs=(SETTINGS.numWorkers||6)*(SETTINGS.hoursPerWorker||10);
  var slots=[];
  for(var i=0;i<6;i++)slots.push({items:[],hrs:0,has60:false,hasRice:false,hasFill:false});
  plan.forEach(function(item){
    var kge=item.unit==='pcs'?item.prod_kg*((ITEMS[item.key].grams_each||100)/1000):item.prod_kg;
    item.est_hrs=estHrs(kge,item.cat);
    // Try to fit from startDay onwards first; if can't fit, it's overflow
    for(var d=startDay;d<6;d++){
      var sl=slots[d];
      if(item.isolated&&sl.hasFill)continue;
      if(!item.isolated&&sl.hasRice&&(item.cat==='filling'||item.cat==='sauce'))continue;
      if(kge>=58&&sl.has60)continue;
      if(sl.hrs+item.est_hrs>maxHrs)continue;
      sl.items.push(item);sl.hrs+=item.est_hrs;
      if(kge>=58)sl.has60=true;
      if(item.isolated)sl.hasRice=true;
      if(item.cat==='filling'||item.cat==='sauce')sl.hasFill=true;
      item.assigned_day=d;return;
    }
  });
  return slots;
}

// ── DISPATCH PLAN ─────────────────────────────────────────────────────────────
function getDispatchPlan(){
  var W={Wed:[],Fri:[],Sat:[]};
  ['HSR','MTH','BTM','IND'].forEach(function(br){
    Object.keys(ITEMS).forEach(function(k){
      if(ITEMS[k].is_raw_material)return;
      var r=getDaily(k);
      if(r<=0)return;
      var s=getStock(br,k);
      var days=s/r;
      var fstock=getStock('FACTORY',k); // what factory can actually send

      function makeEntry(needed){
        var np=Math.ceil(needed/pktSize(k));
        if(np<=0)return null;
        var canSend=Math.min(needed,fstock);
        var canPkts=Math.ceil(canSend/pktSize(k));
        var shortage=fstock<needed-0.01;
        return {branch:br,key:k,label:ITEMS[k].label,
          pkts:canPkts,          // what can actually be dispatched
          neededPkts:np,         // what branch needs
          kg:Math.round(canSend*100)/100,
          days:Math.round(days*10)/10,
          shortage:shortage,     // true = factory can't fully cover
          shortPkts:shortage?np-canPkts:0};
      }

      if(days<4){var n=Math.max(0,2*r-s);var e=makeEntry(n);if(e)W.Wed.push(e);}
      if(days<3){var n=Math.max(0,1.5*r-s);var e=makeEntry(n);if(e)W.Fri.push(e);}
      var targetDays=br==='IND'?5:3;
      var sn=Math.max(0,targetDays*r-s);
      var e=makeEntry(sn);if(e)W.Sat.push(e);
    });
  });
  return W;
}

  var dz=document.getElementById('dropzone'),fi=document.getElementById('fileinput');
  if(dz){
    dz.addEventListener('click',function(){fi.click();});
    dz.addEventListener('dragover',function(e){e.preventDefault();dz.classList.add('active');});
    dz.addEventListener('dragleave',function(){dz.classList.remove('active');});
    dz.addEventListener('drop',function(e){e.preventDefault();dz.classList.remove('active');
      processFiles(Array.from(e.dataTransfer.files).filter(function(f){return f.name.endsWith('.xlsx');}));});
  }
  if(fi)fi.addEventListener('change',function(e){processFiles(Array.from(e.target.files));e.target.value='';});
}

// TAB: CONSUMPTION (in packets)
// ══════════════════════════════════════════════════════════════════════════════
function rConsumption(){
  var mc=document.getElementById('mc');
  var keys=Object.keys(ITEMS).sort(function(a,b){return(ITEMS[b].weekly_kg||0)-(ITEMS[a].weekly_kg||0);});
  var rows='';
  keys.forEach(function(k){
    var it=ITEMS[k];
    var wk=getWeekly(k);
    var ps=pktSize(k);
    var wkPkts=ps>0?Math.round(wk/ps*10)/10:wk;
    var hist=CHIST[k]||[wk,wk,wk,wk,wk];
    var trend=hist.length>=2?hist[hist.length-1]-hist[hist.length-2]:0;
    var tc=trend>0.5?'#10b981':trend<-0.5?'#ef4444':'#9ca3af';
    var ts=trend>0.5?'↑':trend<-0.5?'↓':'→';
    var hmax=Math.max.apply(null,hist)||1;
    var cells='';
    hist.forEach(function(v,i){
      var vp=ps>0?Math.round(v/ps*10)/10:v;
      var op=Math.round(40+60*(v/hmax)).toString(16).padStart(2,'0');
      cells+='<div title="Week -'+(4-i)+': '+vp.toFixed(1)+' pkts" style="width:24px;height:24px;border-radius:3px;background:'+(it.color||'#818cf8')+op+';display:flex;align-items:center;justify-content:center;font-size:9px">'+vp.toFixed(0)+'</div>';
    });
    var pqPkts=it.unit==='pcs'?Math.ceil((it.prod_pcs||wk*PROD_MULT)/(it.pcs_per_pkt||1)):Math.ceil(it.prod_kg/ps);
    rows+='<tr>'
      +'<td><div style="display:flex;align-items:center;gap:8px"><div style="width:10px;height:10px;border-radius:50%;background:'+(it.color||'#aaa')+';flex-shrink:0"></div>'+it.label+'</div></td>'
      +'<td><span class="bx bxp">'+it.freq+'</span></td>'
      +'<td style="font-weight:600">'+wkPkts.toFixed(1)+'</td>'
      +'<td>'+(wkPkts/7).toFixed(2)+'</td>'
      +'<td style="font-size:11px;color:var(--tx2)">'+pktLabel(k)+'</td>'
      +'<td style="color:var(--acc2);font-weight:600">'+pqPkts+'</td>'
      +'<td style="color:'+tc+';font-weight:600">'+ts+' '+Math.abs(trend/ps).toFixed(1)+'</td>'
      +'<td><div style="display:flex;gap:3px">'+cells+'</div></td>'
      +'</tr>';
  });
  mc.innerHTML='<div style="font-size:18px;font-weight:700;margin-bottom:16px">Consumption — All values in packets</div>'
    +'<div class="tw"><table><thead><tr><th>Item</th><th>Freq</th><th>Wkly Pkts</th><th>Daily Pkts</th><th>Pkt Size</th><th>Prod Pkts</th><th>Trend</th><th>5-Week</th></tr></thead>'
    +'<tbody>'+rows+'</tbody></table></div>'
    +'<div style="font-size:12px;color:var(--tx2);margin-top:10px">Production qty includes 15% buffer ÷ 0.85 reheat loss. Patties: 2pcs/pkt. Balls/Fingers: 15pcs/pkt. IND ×1.5 applied.</div>';
}

// ══════════════════════════════════════════════════════════════════════════════
// TAB: PRODUCTION SCHEDULE (in kg)
// ══════════════════════════════════════════════════════════════════════════════
function rSchedule(){
  var mc=document.getElementById('mc');
  var today=new Date();
  var todayDow=(today.getDay()+6)%7; // 0=Mon
  var todayStr=today.toISOString().split('T')[0];
  var dayNames=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

  // ── TODAY: show WHAT WAS ACTUALLY LOGGED, not algorithm ──────────────────
  var todayLogs=PLOGS.filter(function(l){return l.date===todayStr;});
  var todayLoggedKeys={};
  todayLogs.forEach(function(l){todayLoggedKeys[l.key]=(todayLoggedKeys[l.key]||0)+l.pkts;});

  // ── FUTURE DAYS: algorithm, skipping already-logged items ─────────────────
  var plan=buildPlan().filter(function(p){
    // Don't reschedule items already produced today
    return !todayLoggedKeys[p.key];
  });
  var planCopy=plan.map(function(p){return Object.assign({},p);});
  var slots=assignSlots(planCopy,todayDow); // start from today, not Monday
  var assignedMap={};
  planCopy.forEach(function(p){assignedMap[p.key]=p.assigned_day;});
  plan.forEach(function(p){p.assigned_day=assignedMap[p.key]!=null?assignedMap[p.key]:-1;});

  // ── RAW TEMPEH batches needed per day ─────────────────────────────────────
  var tempehItemKeys=['tempeh_keema','peri_peri_tempeh','tempeh_lehsuni','tempeh_bhurji',
    'tandoori_tempeh_patty','rajma_tempeh_patty','chickpea_tempeh_patty','tempeh_balls',
    'keema_momos','peri_peri_momos'];
  var weeklyTempehKg=0;
  tempehItemKeys.forEach(function(k){
    var it=ITEMS[k]; if(!it)return;
    var wkg=it.unit==='pcs'?((it.weekly_pcs||0)*((it.grams_each||0)/1000)):( it.weekly_kg||0);
    weeklyTempehKg+=wkg;
  });
  var batchKg=SETTINGS.tempehBatchKg||20;
  var batchesPerWeek=Math.ceil(weeklyTempehKg/batchKg*1.15); // 15% loss
  // Spread across Mon-Fri (5 days), 1 batch = 1 entry per day approx
  var batchesPerDay=1; // max 1 fermentation batch per day
  var rawStockKg=getStock('FACTORY','raw_tempeh')||0;
  var rawDaysCovered=weeklyTempehKg>0?Math.round(rawStockKg/weeklyTempehKg*7*10)/10:99;

  // ── URGENT ALERTS ─────────────────────────────────────────────────────────
  var urgent=plan.filter(function(p){return p.overdue&&!todayLoggedKeys[p.key];});
  var flagHtml=urgent.length
    ?urgent.map(function(p){return '<div class="flg fg-r"><span>🚨</span><span><strong>'+p.label+'</strong> — '+p.factory_days+'d factory stock. Needs production urgently.</span></div>';}).join('')
    :'<div class="flg fg-g"><span>✓</span><span>All items have adequate stock coverage.</span></div>';

  // ── BUILD DAY CARDS ────────────────────────────────────────────────────────
  var maxHrsDay=(SETTINGS.numWorkers||6)*(SETTINGS.hoursPerWorker||10);

  // Build day cards for all 6 days
  var daysArr=[];
  for(var d=0;d<6;d++){
    var sl=slots[d]||{items:[],hrs:0};
    var isPast=d<todayDow;
    var isToday=d===todayDow;
    var isDispatch=d===2||d===4||d===5;

    var bg=isToday?'background:#2d3147':isPast?'background:#1a1410':'background:#232636';
    var bdr=isToday?'border:2px solid #6366f1':isPast&&sl.items.length?'border:1px solid #7c2d12':'border:1px solid #333650';

    var dayBadge=isToday?'<span style="font-size:11px;color:#818cf8;margin-left:6px">TODAY</span>':isPast&&sl.items.length?'<span style="font-size:11px;color:#ef4444;margin-left:6px">OVERDUE</span>':'';
    var dispBadge=isDispatch?'<span class="bx bxb" style="font-size:10px">🚚 Dispatch</span>':'';

    var itemRows='';

    // Today: show LOGGED production
    if(isToday){
      if(todayLogs.length){
        todayLogs.forEach(function(l){
          var it=ITEMS[l.key];
          var qStr=l.pkts+' pkts';
          itemRows+='<div style="display:flex;align-items:center;gap:8px;padding:6px 8px;background:#0f1117;border-radius:6px;margin-bottom:4px">'
            +'<div style="width:8px;height:8px;border-radius:50%;background:'+(it?it.color:'#aaa')+';flex-shrink:0"></div>'
            +'<div style="flex:1;font-size:12px">'+(it?it.label:l.key)+'</div>'
            +'<span style="font-size:11px;color:#9ca3af">'+qStr+'</span>'
            +'<span class="bx bxg" style="font-size:10px">Logged ✓</span></div>';
        });
        // Add raw tempeh note
        itemRows+='<div style="display:flex;align-items:center;gap:8px;padding:5px 8px;background:rgba(134,204,22,.08);border-radius:6px;margin-bottom:4px;border:1px dashed #4d7c0f">'
          +'<div style="width:8px;height:8px;border-radius:50%;background:#86efac;flex-shrink:0"></div>'
          +'<div style="flex:1;font-size:11px;color:#86efac">🌱 Start '+batchesPerDay+' raw tempeh batch'+(batchesPerDay>1?'es':'')+' ('+( batchesPerDay*batchKg)+'kg) — ready in ~48h</div>'
          +'<span style="font-size:10px;color:#86efac">'+rawStockKg.toFixed(1)+'kg stock</span></div>';
      } else {
        itemRows='<div style="font-size:12px;color:#6b7280;text-align:center;padding:8px">Nothing logged yet today. Use Kitchen Inventory → Log Production.</div>';
      }
    } else {
      // Algorithm items
      if(sl.items.length){
        sl.items.forEach(function(item){
          var dc=item.factory_days<3?'bxr':item.factory_days<5?'bxa':'bxg';
          itemRows+='<div style="display:flex;align-items:center;gap:8px;padding:6px 8px;background:#0f1117;border-radius:6px;margin-bottom:4px">'
            +'<div style="width:8px;height:8px;border-radius:50%;background:'+(item.color||'#aaa')+';flex-shrink:0"></div>'
            +'<div style="flex:1;font-size:12px">'+item.label+'</div>'
            +'<span style="font-size:11px;color:#9ca3af">'+item.prod_kg+' kg</span>'
            +'<span style="font-size:11px;color:#9ca3af">'+(item.est_hrs||0)+'h</span>'
            +'<span class="bx '+dc+'" style="font-size:10px">'+item.factory_days+'d</span></div>';
        });
      } else if(!isPast) {
        itemRows='<div style="font-size:12px;color:#6b7280;text-align:center;padding:8px">Rest / No urgent items</div>';
      } else {
        itemRows='<div style="font-size:12px;color:#4b3020;text-align:center;padding:8px">Overdue — not logged</div>';
      }
      // Add raw tempeh note to all non-past production days
      if(!isPast&&d<5){
        itemRows+='<div style="display:flex;align-items:center;gap:8px;padding:5px 8px;background:rgba(134,204,22,.06);border-radius:6px;margin-top:4px;border:1px dashed #4d7c0f">'
          +'<div style="width:8px;height:8px;border-radius:50%;background:#86efac;flex-shrink:0"></div>'
          +'<div style="flex:1;font-size:11px;color:#86efac">🌱 Start '+batchesPerDay+' raw tempeh batch'+(batchesPerDay>1?'es':'')+' ('+( batchesPerDay*batchKg)+'kg)</div></div>';
      }
    }

    var totalHrs=isToday?0:Math.round(sl.hrs); // today hrs = logged, can't calc easily
    var pct=isToday?Math.min(100,Math.round(todayLogs.length/8*100)):Math.min(100,Math.round(sl.hrs/maxHrsDay*100));
    var barC=pct>90?'#ef4444':pct>70?'#f59e0b':'#10b981';
    var hrsLabel=isToday?(todayLogs.length+' items logged'):( Math.round(sl.hrs)+'h / '+maxHrsDay+'h');

    daysArr.push('<div style="'+bg+';'+bdr+';border-radius:12px;padding:16px">'
      +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">'
      +'<div><div style="font-weight:600;font-size:14px">'+dayNames[d]+dayBadge+'</div>'
      +'<div style="font-size:11px;color:#9ca3af">'+hrsLabel+'</div></div>'
      +'<div>'+dispBadge+'</div></div>'
      +'<div class="sb" style="margin-bottom:12px"><div class="sbf" style="width:'+pct+'%;background:'+barC+'"></div></div>'
      +itemRows+'</div>');
  }

  // ── OVERFLOW ──────────────────────────────────────────────────────────────
  var overflow=plan.filter(function(p){return p.assigned_day===-1;});
  var overHtml=overflow.length?'<div class="card" style="border-color:var(--amb);margin-top:16px"><div class="ct" style="color:var(--amb)">⚠ Overflow — no capacity this week</div><div style="display:flex;flex-wrap:wrap;gap:8px">'+overflow.map(function(i){return '<div style="background:var(--amb-bg);border:1px solid var(--amb);border-radius:6px;padding:6px 10px;font-size:12px">'+i.label+' ('+i.factory_days+'d)</div>';}).join('')+'</div></div>':'';

  // ── RAW TEMPEH SUMMARY ─────────────────────────────────────────────────────
  var tempehSummary='<div class="card" style="margin-bottom:16px;border-color:#4d7c0f">'
    +'<div style="display:flex;align-items:center;justify-content:space-between">'
    +'<div class="ct" style="margin:0;color:#86efac">🌱 Raw Tempeh Production Plan</div>'
    +'<span class="bx" style="background:rgba(134,204,22,.12);color:#86efac">'+rawStockKg.toFixed(1)+'kg stock · '+rawDaysCovered+'d coverage</span>'
    +'</div>'
    +'<div style="font-size:13px;color:var(--tx2);margin-top:10px">'
    +'Weekly tempeh consumption: <strong style="color:var(--tx)">'+weeklyTempehKg.toFixed(1)+' kg</strong> across all products · '
    +'Requires <strong style="color:var(--tx)">'+batchesPerWeek+' batches</strong> of '+batchKg+'kg · '
    +'<strong style="color:var(--tx)">'+batchesPerDay+' batch/day</strong> Mon–Fri · '
    +'Fermentation: ~48h · Start batches 2 days before they\'re needed for dispatch.'
    +'</div></div>';

  // ── PRIORITY QUEUE ────────────────────────────────────────────────────────
  var allPlan=buildPlan();
  var allCopy=allPlan.map(function(p){return Object.assign({},p);});
  assignSlots(allCopy,todayDow);
  var am2={};allCopy.forEach(function(p){am2[p.key]=p.assigned_day;});
  allPlan.forEach(function(p){p.assigned_day=am2[p.key]!=null?am2[p.key]:-1;});

  var prioRows=allPlan.map(function(p,i){
    var ad=p.assigned_day;
    var dayLabel=ad>=0?dayNames[ad]:'—';
    var isLogged=!!todayLoggedKeys[p.key];
    var status=isLogged?'<span class="bx bxg">Done Today ✓</span>':ad<0?'<span class="bx bxr">No capacity</span>':ad<todayDow?'<span class="bx" style="background:#4b2800;color:#f97316">Overdue</span>':ad===todayDow?'<span class="bx bxb">Today</span>':'<span class="bx" style="background:var(--surf3);color:var(--tx2)">'+dayLabel+'</span>';
    var qtyStr=p.unit==='pcs'?p.prod_kg+' pcs':p.prod_kg+' kg';
    return '<tr>'
      +'<td style="color:var(--tx2)">'+(i+1)+'</td>'
      +'<td><div style="display:flex;align-items:center;gap:6px"><div style="width:8px;height:8px;border-radius:50%;background:'+(p.color||'#aaa')+'"></div>'+p.label+'</div></td>'
      +'<td><span class="bx bxp">'+p.freq+'</span></td>'
      +'<td><span style="color:'+scol(p.factory_days)+';font-weight:600">'+p.factory_days+'</span></td>'
      +'<td><span style="color:'+scol(p.total_days)+';font-weight:600">'+p.total_days+'</span></td>'
      +'<td>'+qtyStr+'</td>'
      +'<td>'+status+'</td>'
      +'</tr>';
  }).join('');

  var maxHrsDay2=(SETTINGS.numWorkers||6)*(SETTINGS.hoursPerWorker||10);
  var lastUpload=UPMETA.last?new Date(UPMETA.last).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'Never';
  var dataNote='Consumption rates from baseline (Feb 1–Apr 10)'+(UPMETA.last?' + uploads to '+lastUpload:'');
  mc.innerHTML=flagHtml+tempehSummary
    +'<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:16px">'
    +'<div><h2 style="font-size:18px;font-weight:700">Production Schedule</h2>'
    +'<div style="font-size:12px;color:var(--tx2)">'+dataNote+'</div></div>'
    +'<div style="display:flex;align-items:center;gap:10px;background:var(--surf2);padding:8px 14px;border-radius:var(--r);border:1px solid var(--bdr)">'
    +'<span style="font-size:12px;color:var(--tx2)">People</span>'
    +'<input type="number" id="sch-workers" value="'+(SETTINGS.numWorkers||6)+'" min="1" max="15" style="width:55px;text-align:center;font-weight:700">'
    +'<span style="font-size:12px;color:var(--tx2)">× hrs/day</span>'
    +'<input type="number" id="sch-hrs" value="'+(SETTINGS.hoursPerWorker||10)+'" min="6" max="14" style="width:50px;text-align:center;font-weight:700">'
    +'<span style="font-size:12px;color:var(--acc2);font-weight:600">= '+maxHrsDay2+'h/day</span>'
    +'<button class="btn bp bsm" onclick="saveScheduleWorkers()">Apply</button>'
    +'</div></div>'
    +'<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px">'+daysArr.slice(0,3).join('')+'</div>'
    +'<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px">'+daysArr.slice(3,6).join('')+'</div>'
    +overHtml
    +'<div class="card" style="margin-top:16px"><div class="ct">Priority Queue — All Items</div>'
    +'<div class="tw"><table><thead><tr><th>#</th><th>Item</th><th>Freq</th><th>Factory Days</th><th>Total Days</th><th>Prod Qty</th><th>Status</th></tr></thead>'
    +'<tbody>'+prioRows+'</tbody></table></div></div>';
}

}

function logDisp(){
  var key=document.getElementById('di').value;
  var pkts=parseFloat(document.getElementById('dq').value);
  var from=document.getElementById('df').value;
  var to=document.getElementById('dt').value;
  var reason=document.getElementById('dr').value;
  var msg=document.getElementById('dm');
  if(!pkts||pkts<=0){msg.innerHTML='<span style="color:#ef4444">Enter valid quantity.</span>';return;}
  if(from===to){msg.innerHTML='<span style="color:#ef4444">From and To cannot be same.</span>';return;}
  var internalQty=fromPackets(key,pkts);
  var avail=getStock(from,key);
  DLOGS.push({id:Date.now(),key:key,pkts:pkts,qty:internalQty,from:from,to:to,reason:reason,at:Date.now()});
  addStock(from,key,-internalQty);
  addStock(to,key,internalQty);
  var extra=internalQty>avail+0.001?' <span style="color:#f59e0b">⚠ Only '+toPackets(key,avail)+' pkts available</span>':'';
  msg.innerHTML='<span style="color:#10b981">✓ '+pkts+' pkts moved '+from+' → '+to+'.</span>'+extra;
  setTimeout(function(){rInvDisp();},1500);
}

function useRawTempehBatch(){
  var batchKg=SETTINGS.tempehBatchKg||20;

  addStock('FACTORY','raw_tempeh',-batchKg);
  rTempeh();
}

  var rows=keys.map(function(k){
    var it=ITEMS[k];var ps=pktSize(k);
    var wkPkts=ps>0?Math.ceil(getWeekly(k)/ps):0;
    var prodPkts=ps>0?Math.ceil(it.prod_kg/ps):0;
    if(it.unit==='pcs'){wkPkts=Math.ceil((it.weekly_pcs||0)/(it.pcs_per_pkt||1));prodPkts=Math.ceil((it.prod_pcs||0)/(it.pcs_per_pkt||1));}
    return '<tr><td><div style="display:flex;align-items:center;gap:6px"><div style="width:8px;height:8px;border-radius:50%;background:'+(it.color||'#aaa')+'"></div>'+it.label+'</div></td>'
      +'<td><span class="bx bxp">'+it.freq+'</span></td>'
      +'<td>'+pktLabel(k)+'</td>'
      +'<td>'+wkPkts+'</td>'
      +'<td style="font-weight:600">'+prodPkts+'</td></tr>';
  }).join('');
  mc.innerHTML='<div class="card"><div class="ct">Weekly Packaging Requirements (Packets)</div>'
    +'<div class="tw"><table><thead><tr><th>Item</th><th>Freq</th><th>Pkt Size</th><th>Weekly Pkts</th><th>Prod Cycle Pkts</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}

// TAB: SETTINGS
// ══════════════════════════════════════════════════════════════════════════════
function rSettings(){
  var mc=document.getElementById('mc');
  var wInputs=SETTINGS.workers.map(function(w,i){return '<div class="fg"><label>Worker '+(i+1)+'</label><input type="text" id="wi'+i+'" value="'+w+'"></div>';}).join('');
  mc.innerHTML='<div class="g2" style="gap:20px">'
    +'<div class="card"><div class="ct">Worker Names</div><p style="font-size:12px;color:var(--tx2);margin-bottom:12px">Rename P1/P2 when staff changes.</p>'
    +wInputs+'<button class="btn bp" onclick="saveWorkers()">Save Workers</button><div id="wm" style="margin-top:8px;font-size:12px"></div></div>'
    +'<div class="card"><div class="ct">Target Stock Days</div>'
    +'<div class="fg"><label>Factory</label><input type="number" id="tf" value="'+SETTINGS.target.factory+'"></div>'
    +'<div class="fg"><label>Number of Factory Workers</label><input type="number" id="sw" value="'+(SETTINGS.numWorkers||6)+'"></div>'
    +'<div class="fg"><label>Hours per Worker per Day</label><input type="number" id="sh" value="'+(SETTINGS.hoursPerWorker||10)+'"></div>'
    +'<div class="fg"><label>Cloud (HSR/MTH/BTM)</label><input type="number" id="tc" value="'+SETTINGS.target.cloud+'"></div>'
    +'<div class="fg"><label>QSR — Indiranagar</label><input type="number" id="tq" value="'+SETTINGS.target.qsr+'"></div>'
    +'<button class="btn bp" onclick="saveTargets()">Save Targets</button><div id="tm" style="margin-top:8px;font-size:12px"></div></div>'
    +'</div>'
    +'<div class="card" style="margin-top:16px"><div class="ct" style="color:var(--red)">Danger Zone</div>'
    +'<div style="display:flex;gap:10px">'
    +'<button class="btn bd bsm" onclick="if(confirm(\'Reset all stock to Apr 14 closing stock?\'))resetStock()">Reset to Apr 14 Stock</button>'
    +'<button class="btn bd bsm" onclick="if(confirm(\'Clear production logs?\'))clearPL()">Clear Prod Logs</button>'
    +'<button class="btn bd bsm" onclick="if(confirm(\'Clear dispatch logs?\'))clearDL()">Clear Dispatch Logs</button>'
    +'</div></div>';
}
function saveScheduleWorkers(){
  var w=parseInt(document.getElementById('sch-workers').value)||6;
  var h=parseInt(document.getElementById('sch-hrs').value)||10;
  SETTINGS.numWorkers=Math.max(1,Math.min(15,w));
  SETTINGS.hoursPerWorker=Math.max(6,Math.min(14,h));
  save();rSchedule();
}
function saveWorkers(){SETTINGS.workers=Array.from({length:5},function(_,i){return document.getElementById('wi'+i).value.trim()||'P'+(i+1);});save();document.getElementById('wm').innerHTML='<span style="color:#10b981">✓ Saved</span>';}
function saveTargets(){SETTINGS.target.factory=parseInt(document.getElementById('tf').value)||10;
  SETTINGS.numWorkers=parseInt(document.getElementById('sw').value)||6;
  SETTINGS.hoursPerWorker=parseInt(document.getElementById('sh').value)||10;SETTINGS.target.cloud=parseInt(document.getElementById('tc').value)||7;SETTINGS.target.qsr=parseInt(document.getElementById('tq').value)||5;save();document.getElementById('tm').innerHTML='<span style="color:#10b981">✓ Saved</span>';}
function resetStock(){STOCK=JSON.parse(JSON.stringify(INIT_STOCK));CHIST=JSON.parse(JSON.stringify(CHIST_BASELINE));save();go('inventory');}
function clearPL(){PLOGS=[];save();rSettings();}
function clearDL(){DLOGS=[];XFERS=[];save();rSettings();}

// ── INIT ─────────────────────────────────────────────────────────────────────
updCov();
go('upload');
</script></body></html>
